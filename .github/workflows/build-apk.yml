name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Chiave di firma (facoltativa, dai secret del repository)
        env:
          KEYSTORE_BASE64: ${{ secrets.BUYFORTIME_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > app/buyfortime.keystore; fi
      - name: Compila l'APK
        env:
          BUYFORTIME_KEY_PASSWORD: ${{ secrets.BUYFORTIME_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: BuyForTime-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Pubblica l'APK nelle Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONE=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          ls app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk "BuyForTime-v${VERSIONE}.apk"
          OUT=$(gh release create "v${VERSIONE}-build${{ github.run_number }}" "BuyForTime-v${VERSIONE}.apk" --title "BuyForTime ${VERSIONE} build ${{ github.run_number }}" --notes "APK compilato automaticamente da GitHub Actions." 2>&1) || { echo "::error::release: $OUT"; exit 1; }
      - name: Registro degli errori
        if: failure()
        run: |
          # gli errori diventano annotazioni, leggibili dall'API anche senza scaricare i log
          if [ -f build.log ]; then
            grep -E "^e: |error:|What went wrong|FAILED|AssertionError|expected" -A4 build.log | head -60 | while IFS= read -r riga; do echo "::error::$riga"; done
          fi
